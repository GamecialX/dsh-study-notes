<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{库名}}</title>
<link rel="stylesheet" href="src/css/theme.css">
<script src="src/js/nav-data.js"></script>
<script src="src/js/shell.js" defer></script>
</head>
<!-- 库首页：课程地图。章节卡片由 shell.js 按 nav-data.js 自动生成；
     你只需要写标题、一句课程定位、以及可选的"怎么用这个库"。 -->
<body data-lesson="" data-chapter="" data-track="{{practice}}" data-title="{{库名}}" data-root="">

<div class="track" id="track" data-scope="library"><div class="in"></div></div>

<div class="mast">
  <div>{{库名}} · 课程地图</div>
  <div class="r">
    <button id="theme-btn" type="button" class="mini">主题</button>
  </div>
</div>

<div class="lede">
  <h1>{{库名}}</h1>
  <div class="sub">{{一句话说清这门课把谁从哪儿带到哪儿。}}</div>
  <div class="bar-row">
    <span data-role="progress">0 / 0 节完成</span>
    <div class="bar"><i data-role="progress-bar"></i></div>
    <span data-role="score-avg">还没有交过卷</span>
  </div>
</div>

<div class="chlist" data-role="chapter-list"></div>

<div class="wrap"><div class="main">
  <div class="sum" style="margin-top:0">
    <h3>怎么用这个库</h3>
    <ul>
      <li>{{双击任意页就能看，不需要联网、不需要装东西。}}</li>
      <li>{{每节先读导读，再照着"做"那一段动手；看不懂的地方先看页边批注。}}</li>
      <li>{{读完一节点右上角"标记本节完成"，首页的进度会自己记住。}}</li>
    </ul>
  </div>
</div></div>

</body>
</html>

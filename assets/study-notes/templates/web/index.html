</div>

<div class="nav-scrim" id="nav-scrim"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<noscript>
  <div style="padding:40px;font-family:sans-serif">
    <h2>需要启用 JavaScript</h2>
    <p>本学习门户是一个单文件网页应用，需要浏览器启用 JavaScript 才能阅读笔记与做题。</p>
  </div>
</noscript>

<script>
(function () {
  "use strict";

  /* ============================================================
     1. 常量与小工具
     ============================================================ */

  var LS = {
    progress: "notes_portal:progress",
    scores: "notes_portal:scores",
    last: "notes_portal:last",
    quiz: "notes_portal:quiz"
  };

  /* KaTeX 优先用随门户分发的本地副本（web/vendor/katex/，离线可用）；
     本地副本缺失或被删时才回退 CDN。本地是 0.16.22，CDN 是 0.16.11，排版一致。 */
  var KATEX = {
    local: { css: "vendor/katex/katex.min.css", js: "vendor/katex/katex.min.js" },
    cdn: {
      css: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
      js: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    }
  };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function escAttr(s) { return esc(s); }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function num(v, d) { var n = Number(v); return isFinite(n) ? n : d; }

  function readLS(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      var v = JSON.parse(raw);
      return (v && typeof v === "object") ? v : fallback;
    } catch (e) { return fallback; }
  }
  function writeLS(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 隐私模式等：忽略 */ }
  }
  function dropLS(key) { try { localStorage.removeItem(key); } catch (e) {} }

  function toast(msg, kind) {
    var el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = msg;
    $("#toasts").appendChild(el);
    setTimeout(function () {
      el.style.transition = "opacity .25s ease";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 260);
    }, 2600);
  }

  function modal(opts) {
    var scrim = $("#scrim"), box = $("#modal");
    box.innerHTML =
      '<h3>' + esc(opts.title) + '</h3>' +
      '<p>' + (opts.html || esc(opts.body || "")) + '</p>' +
      '<div class="acts">' +
      '<button class="btn ghost" data-act="cancel">' + esc(opts.cancel || "取消") + '</button>' +
      '<button class="btn ' + (opts.danger ? "danger" : "primary") + '" data-act="ok">' + esc(opts.ok || "确定") + '</button>' +
      '</div>';
    scrim.classList.add("on");
    function close() { scrim.classList.remove("on"); box.innerHTML = ""; document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    box.onclick = function (e) {
      var b = e.target.closest("[data-act]");
      if (!b) return;
      close();
      if (b.getAttribute("data-act") === "ok" && opts.onOk) opts.onOk();
    };
    scrim.onclick = function (e) { if (e.target === scrim) close(); };
    document.addEventListener("keydown", onKey);
    var first = $('button[data-act="ok"]', box);
    if (first) first.focus();
  }

  /* ============================================================
     2. 状态
     ============================================================ */

  var state = {
    data: null,
    index: null,
    cache: {},
    mdCache: {},
    progress: {},
    scores: {},
    quiz: {},
    last: null,
    opts: { katex: "auto", fillCaseSensitive: false },
    katexLoaded: false,
    testDraft: null
  };

  function saveProgress() { writeLS(LS.progress, state.progress); }
  function saveScores() { writeLS(LS.scores, state.scores); }
  function saveQuiz() { writeLS(LS.quiz, state.quiz); }

  /* ============================================================
     3. 数据索引
     ============================================================ */

  function buildIndex(data) {
    var sections = {}, titles = {}, chapterOf = {}, all = [], files = {};
    (data.chapters || []).forEach(function (ch) {
      chapterOf[ch.id] = ch;
      titles["C" + ch.no + " 测试"] = { kind: "test", cid: ch.id };
      titles[ch.title] = { kind: "chapter", cid: ch.id };
      if (ch.test && ch.test.file) files[ch.test.file] = { kind: "test", cid: ch.id };
      if (ch.sheet && ch.sheet.file) files[ch.sheet.file] = { kind: "sheet", cid: ch.id };
      (ch.sections || []).forEach(function (sec) {
        sections[sec.id] = { chapter: ch, section: sec };
        all.push({ chapter: ch, section: sec });
        titles[sec.title] = { kind: "section", sid: sec.id };
        if (sec.file) files[sec.file] = { kind: "section", sid: sec.id };
        conceptNames(sec).forEach(function (a) {
          titles[a] = { kind: "section", sid: sec.id, concept: true };
        });
      });
    });
    return { sections: sections, titles: titles, chapterOf: chapterOf, all: all, files: files };
  }

  /* 新数据用 concepts: [{ n, name }]；旧数据用 atomic: ["标题"]。两种都认。 */
  function conceptNames(sec) {
    if (Array.isArray(sec.concepts)) {
      return sec.concepts.map(function (c) { return c && typeof c === "object" ? String(c.name || "") : String(c); })
        .filter(function (s) { return s.length; });
    }
    return Array.isArray(sec.atomic) ? sec.atomic.slice() : [];
  }

  /* 与 check-library.mjs 的 slugify 保持一致：去掉 ` * _ ~ [ ] ( )，其余非字母数字的连续字符换成 -。 */
  function slugify(text) {
    return String(text).trim().toLowerCase()
      .replace(/[`*_~\[\]()]/g, "")
      .replace(/[^\p{L}\p{N}]+/gu, "-")
      .replace(/^-+|-+$/g, "");
  }

  function looseKey(text) {
    return String(text).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  /** 把正文里的标准链接翻译成门户路由；找不到对应条目时返回 null。 */
  function resolveMdLink(href, ctx) {
    var hashAt = href.indexOf("#");
    var path = hashAt >= 0 ? href.slice(0, hashAt) : href;
    var anchor = hashAt >= 0 ? safeDecode(href.slice(hashAt + 1)) : "";
    if (!path) return { route: null, anchor: anchor };
    var abs = resolveRelative(ctx && ctx.file, safeDecode(path));
    if (/\/00 大纲\.md$/.test(abs) || abs === "/00 大纲.md") return { route: "#/home", anchor: "" };
    var hit = state.index && state.index.files[abs];
    if (!hit) return null;
    if (hit.kind === "test") return { route: "#/test/" + hit.cid, anchor: "" };
    if (hit.kind === "sheet") return { route: "#/sheet/" + hit.cid, anchor: anchor };
    return { route: "#/read/" + hit.sid, anchor: anchor };
  }

  function allSections() { return state.index ? state.index.all : []; }

  function chapterProgress(ch) {
    var total = (ch.sections || []).length;
    var done = (ch.sections || []).filter(function (s) { return state.progress[s.id]; }).length;
    return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function overallProgress() {
    var total = 0, done = 0;
    (state.data.chapters || []).forEach(function (ch) {
      var p = chapterProgress(ch); total += p.total; done += p.done;
    });
    return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
  }

  function scoreAverage() {
    var vals = [], n = 0;
    (state.data.chapters || []).forEach(function (ch) {
      var s = state.scores[ch.id];
      if (s && typeof s.best === "number") { vals.push(s.best); n++; }
    });
    if (!n) return null;
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    return Math.round(sum / n);
  }

  /* ============================================================
     4. 迷你 Markdown 渲染器
     ============================================================ */

  var CALLOUT_ICON = {
    abstract: "◆", summary: "◆", tldr: "◆",
    note: "▸", info: "▸", todo: "▸",
    tip: "✦", hint: "✦", important: "✦",
    example: "❖", quote: "❝", cite: "❝",
    question: "？", help: "？", faq: "？",
    warning: "▲", caution: "▲", attention: "▲", danger: "▲", error: "▲", failure: "▲", fail: "▲", bug: "▲",
    success: "✔", check: "✔", done: "✔"
  };

  function renderMath(tex, display) {
    var raw = display ? "$$" + tex + "$$" : "$" + tex + "$";
    if (state.katexLoaded && window.katex) {
      try {
        return window.katex.renderToString(tex, { displayMode: !!display, throwOnError: false });
      } catch (e) { /* 降级 */ }
    }
    return '<span class="tex' + (display ? " tex-block" : "") + '" data-tex="' + escAttr(tex) + '">' + esc(raw) + "</span>";
  }

  function emphasize(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/~~([^~]+)~~/g, "<del>$1</del>");
  }

  function resolveWiki(target, alias) {
    var key = String(target).trim();
    var label = alias && String(alias).length ? String(alias) : key;
    /* 数据尚未就绪时（例如启动错误页）不做悬空判定，只做中性呈现。 */
    if (!state.index) return '<span class="wl">' + esc(label) + "</span>";
    var hit = state.index.titles[key];
    if (!hit) {
      return '<span class="wl-missing" title="库中没有名为「' + escAttr(key) + '」的笔记">' + esc(label) + "</span>";
    }
    if (hit.kind === "test") return '<a href="#/test/' + hit.cid + '">' + esc(label) + "</a>";
    if (hit.kind === "chapter") return '<a href="#/read/' + (firstSectionOf(hit.cid) || "") + '">' + esc(label) + "</a>";
    return '<a href="#/read/' + hit.sid + '">' + esc(label) + "</a>";
  }

  function firstSectionOf(cid) {
    if (!state.index) return null;
    var ch = state.index.chapterOf[cid];
    if (!ch || !ch.sections || !ch.sections.length) return null;
    return ch.sections[0].id;
  }

  function resolveRelative(baseFile, rel) {
    var base = String(baseFile || "").replace(/\\/g, "/");
    var dir = base.slice(0, base.lastIndexOf("/"));
    if (dir) dir += "/";
    var parts = (dir + rel).split("/");
    var out = [];
    parts.forEach(function (p) {
      if (p === "" || p === ".") return;
      if (p === "..") { out.pop(); return; }
      out.push(p);
    });
    return "/" + out.join("/");
  }

  function imgTag(src, alt) {
    return '<img src="' + escAttr(src) + '" alt="' + escAttr(alt || "") + '" loading="lazy" data-src="' + escAttr(src) + '">';
  }

  function renderEmbed(name, alt, ctx) {
    var file = String(name).trim();
    if (/^https?:/i.test(file) || file.charAt(0) === "/") return imgTag(file, alt || file);
    var chNo = ctx && ctx.chapterNo != null ? ctx.chapterNo : null;
    return imgTag(chNo != null ? "/Cha_" + chNo + "/src/" + file : "/" + file, alt || file);
  }

  function renderImage(src, alt, ctx) {
    if (/^https?:/i.test(src) || String(src).charAt(0) === "/") return imgTag(src, alt || "");
    return imgTag(resolveRelative(ctx && ctx.file, src), alt || "");
  }

  /**
   * 图片加载失败时替换为可读的提示块。
   *
   * 在渲染完成后再统一挂载，而不是把 onerror 写进 HTML 属性——后者需要把
   * 引号层层转义进一个内联 JS 字符串里，既脆弱又容易造成注入。
   */
  function fixImages(root) {
    $$("img[data-src]", root).forEach(function (img) {
      img.addEventListener("error", function () {
        var span = document.createElement("span");
        span.className = "img-missing";
        span.textContent = "图片缺失：" + img.getAttribute("data-src");
        if (img.parentNode) img.parentNode.replaceChild(span, img);
      }, { once: true });
      if (img.complete && img.naturalWidth === 0) {
        var span = document.createElement("span");
        span.className = "img-missing";
        span.textContent = "图片缺失：" + img.getAttribute("data-src");
        if (img.parentNode) img.parentNode.replaceChild(span, img);
      }
    });
  }

  function postRender(root) { fixImages(root); upgradeMath(root); }

  function inline(text, ctx) {
    var stash = [];
    function keep(html) { stash.push(html); return "\u0000" + (stash.length - 1) + "\u0000"; }

    var s = String(text == null ? "" : text);

    s = s.replace(/\$([^$\n]+?)\$/g, function (m, tex) { return keep(renderMath(tex, false)); });
    s = s.replace(/!\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g, function (m, f, a) { return keep(renderEmbed(f, a, ctx)); });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, function (m, a, src) { return keep(renderImage(src, a, ctx)); });
    s = s.replace(/\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g, function (m, t, a) { return keep(resolveWiki(t, a)); });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]*)(?:\s+"[^"]*")?\)/g, function (m, t, href) {
      var label = allowSafeHtml(emphasize(esc(t)));
      if (/^[a-z][a-z0-9+.-]*:/i.test(href)) {
        return keep('<a href="' + escAttr(href) + '" target="_blank" rel="noreferrer noopener">' + label + "</a>");
      }
      if (!href) return keep('<span class="wl-missing" title="空链接">' + label + "</span>");
      if (href.charAt(0) === "#") {
        return keep('<a href="#" data-anchor="' + escAttr(safeDecode(href.slice(1))) + '">' + label + "</a>");
      }
      var r = resolveMdLink(href, ctx);
      if (!r || !r.route) {
        if (!state.index) return keep('<span class="wl">' + label + "</span>");
        return keep('<span class="wl-missing" title="门户里找不到：' + escAttr(safeDecode(href)) + '">' + label + "</span>");
      }
      return keep('<a href="' + r.route + '"' + (r.anchor ? ' data-anchor="' + escAttr(r.anchor) + '"' : "") + ">" + label + "</a>");
    });

    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function (m, c) { return keep('<code class="ic">' + c + "</code>"); });
    s = emphasize(s);
    s = allowSafeHtml(s);
    s = s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return stash[Number(i)]; });
    return s;
  }

  /* 笔记的标注标签写作 <b>*Note*</b>，正文偶尔也用 <sub>/<sup>/<kbd>。
     esc() 之后只把这几个无属性的行内标签还原，其余 HTML 仍按文字显示。 */
  function allowSafeHtml(s) {
    return s.replace(/&lt;(\/?)(b|strong|i|em|u|sub|sup|kbd|mark)&gt;/g, "<$1$2>")
      .replace(/&lt;br\s*\/?&gt;/g, "<br>");
  }

  function isBlockStart(line) {
    return /^\s*(#{1,6})\s+/.test(line) ||
      /^\s*>/.test(line) ||
      /^\s*(```|~~~)/.test(line) ||
      /^\s*([-*+]|\d+[.)])\s+/.test(line) ||
      /^\s*\$\$\s*$/.test(line) ||
      /^\s*([-*_])(\s*\1){2,}\s*$/.test(line);
  }

  function renderMarkdown(src, ctx) {
    var lines = String(src == null ? "" : src).replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var i = 0;
    var skippedTitle = false;

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      /* --- 围栏代码块 --- */
      var fence = /^\s*(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/.exec(line);
      if (fence) {
        var marker = fence[1].charAt(0);
        var lang = (fence[2] || "").toLowerCase();
        var buf = [];
        i++;
        while (i < lines.length && !new RegExp("^\\s*" + marker + "{3,}\\s*$").test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push(codeBlock(lang, buf.join("\n")));
        continue;
      }

      /* --- 独立行公式 $$...$$ --- */
      var oneLine = /^\s*\$\$(.+?)\$\$\s*$/.exec(line);
      if (oneLine) { out.push(renderMath(oneLine[1], true)); i++; continue; }
      if (/^\s*\$\$\s*$/.test(line)) {
        var mbuf = [];
        i++;
        while (i < lines.length && !/^\s*\$\$\s*$/.test(lines[i])) { mbuf.push(lines[i]); i++; }
        i++;
        out.push(renderMath(mbuf.join("\n"), true));
        continue;
      }

      /* --- 标题 --- */
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        var level = h[1].length;
        var text = h[2].replace(/\s+#+\s*$/, "").trim();
        if (level === 1 && !skippedTitle) {
          skippedTitle = true;
          if (ctx && ctx.title && text === ctx.title) { i++; continue; }
        }
        out.push("<h" + level + ' id="' + escAttr(slugify(text)) + '">' + inline(text, ctx) + "</h" + level + ">");
        i++;
        continue;
      }

      /* --- 分割线 --- */
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      /* --- 引用 / Callout --- */
      if (/^\s*>/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { qbuf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
        out.push(renderQuote(qbuf, ctx));
        continue;
      }

      /* --- 表格 --- */
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        var tbl = [];
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) { tbl.push(lines[i]); i++; }
        out.push(renderTable(tbl, ctx));
        continue;
      }

      /* --- 列表 --- */
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        var lbuf = [];
        while (i < lines.length) {
          if (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) { lbuf.push(lines[i]); i++; continue; }
          if (lines[i].trim() && /^\s{1,}/.test(lines[i]) && !isBlockStart(lines[i])) { lbuf.push(lines[i]); i++; continue; }
          if (!lines[i].trim() && i + 1 < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i + 1])) { i++; continue; }
          break;
        }
        out.push(renderListBlock(lbuf, ctx));
        continue;
      }

      /* --- 段落 --- */
      var pbuf = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i]) &&
             !/^\s*\|/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        pbuf.push(lines[i]); i++;
      }
      out.push("<p>" + pbuf.map(function (l) { return inline(l, ctx); }).join("<br>") + "</p>");
    }

    return out.join("\n");
  }

  function codeBlock(lang, code) {
    var isMermaid = lang === "mermaid";
    var label = lang || "text";
    var body = isMermaid
      ? '<div class="cb-mermaid"><pre><code>' + esc(code) + "</code></pre>" +
        '<div class="mermaid-hint">◇ Mermaid 图：在 Typora / VS Code / GitHub 中渲染为图表；网页端以源码呈现。</div></div>'
      : "<pre><code>" + esc(code) + "</code></pre>";
    return '<div class="cb">' +
      '<div class="cb-bar"><span class="cb-lang">' + esc(label) + '</span>' +
      '<button class="cb-copy" type="button">复制</button></div>' +
      body + "</div>";
  }

  function renderQuote(buf, ctx) {
    var head = /^\s*\[!([\w-]+)\]([+-]?)\s*(.*)$/.exec(buf[0] || "");
    if (head) {
      var type = head[1].toLowerCase();
      var fold = head[2] === "-";
      var title = head[3].trim() || (type.charAt(0).toUpperCase() + type.slice(1));
      var inner = buf.slice(1);
      return '<div class="callout callout--' + escAttr(type) + (fold ? " callout-fold" : "") + '">' +
        '<div class="callout-head"' + (fold ? ' role="button" tabindex="0"' : "") + ">" +
        '<span class="callout-ico">' + esc(CALLOUT_ICON[type] || "▸") + "</span>" +
        '<span class="callout-title">' + esc(title) + "</span>" +
        (fold ? '<span class="callout-arrow">▶</span>' : "") +
        "</div>" +
        '<div class="callout-body">' + renderMarkdown(inner.join("\n"), ctx) + "</div>" +
        "</div>";
    }
    var label = /^\s*(?:<b>\s*\*?(Note|Tip|Important|Warning|Caution)\*?\s*<\/b>|\*\*(Note|Tip|Important|Warning|Caution)\*\*:?)\s*(.*)$/i.exec(buf[0] || "");
    if (label) {
      var ltype = (label[1] || label[2]).toLowerCase();
      var rest = buf.slice(1);
      var ltitle = label[3].trim();
      if (!ltitle && rest.length && rest[0].trim() && !isBlockStart(rest[0])) { ltitle = rest[0].trim(); rest = rest.slice(1); }
      var lfold = /答案与解析|参考答案/.test(ltitle);
      return '<div class="callout callout--' + ltype + (lfold ? " callout-fold" : "") + '">' +
        '<div class="callout-head"' + (lfold ? ' role="button" tabindex="0"' : "") + ">" +
        '<span class="callout-ico">' + esc(CALLOUT_ICON[ltype] || "▸") + "</span>" +
        '<span class="callout-title">' + inline(ltitle || ltype.charAt(0).toUpperCase() + ltype.slice(1), ctx) + "</span>" +
        (lfold ? '<span class="callout-arrow">▶</span>' : "") +
        "</div>" +
        '<div class="callout-body">' + renderMarkdown(rest.join("\n"), ctx) + "</div>" +
        "</div>";
    }
    return "<blockquote>" + renderMarkdown(buf.join("\n"), ctx) + "</blockquote>";
  }

  function renderTable(rows, ctx) {
    function cells(row) {
      var t = row.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var head = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = "<table><thead><tr>";
    head.forEach(function (c) { html += "<th>" + inline(c, ctx) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      for (var k = 0; k < head.length; k++) html += "<td>" + inline(r[k] == null ? "" : r[k], ctx) + "</td>";
      html += "</tr>";
    });
    return html + "</tbody></table>";
  }

  function renderListBlock(blockLines, ctx) {
    var flat = [];
    blockLines.forEach(function (raw) {
      var m = /^([ \t]*)([-*+]|\d+[.)])[ \t]+(.*)$/.exec(raw);
      if (m) {
        flat.push({ indent: m[1].replace(/\t/g, "  ").length, ordered: /\d/.test(m[2]), text: m[3], cont: [] });
      } else if (flat.length) {
        flat[flat.length - 1].cont.push(raw.trim());
      }
    });
    if (!flat.length) return "";

    var root = { children: [] };
    var stack = [{ indent: -1, node: root }];
    flat.forEach(function (item) {
      while (stack.length > 1 && stack[stack.length - 1].indent >= item.indent) stack.pop();
      var node = { item: item, children: [] };
      stack[stack.length - 1].node.children.push(node);
      stack.push({ indent: item.indent, node: node });
    });

    function renderNode(node) {
      var item = node.item;
      var inner;
      var task = /^\[([ xX])\]\s+(.*)$/.exec(item.text);
      if (task) {
        inner = '<label class="task"><input type="checkbox" disabled' +
          (task[1].toLowerCase() === "x" ? " checked" : "") + "><span>" + inline(task[2], ctx) + "</span></label>";
      } else if (item.cont.length) {
        inner = inline(item.text, ctx) + renderMarkdown(item.cont.join("\n"), ctx);
      } else {
        inner = inline(item.text, ctx);
      }
      var kids = node.children.length ? renderChildren(node.children) : "";
      return "<li>" + inner + kids + "</li>";
    }
    function renderChildren(nodes) {
      /* 同一层里标记类型相同时才属于同一个列表；无序与有序相邻时必须各起一个
         ul / ol，否则有序项会被塞进 ul 里而失去编号语义。 */
      var html = "";
      var i = 0;
      while (i < nodes.length) {
        var ordered = !!nodes[i].item.ordered;
        var run = [];
        while (i < nodes.length && !!nodes[i].item.ordered === ordered) { run.push(nodes[i]); i++; }
        var tag = ordered ? "ol" : "ul";
        html += "<" + tag + ">" + run.map(renderNode).join("") + "</" + tag + ">";
      }
      return html;
    }
    return renderChildren(root.children);
  }

  function stripFrontmatter(text) {
    var m = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(text);
    if (!m) return { body: text, meta: {} };
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var idx = line.indexOf(":");
      if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
    });
    return { body: text.slice(m[0].length), meta: meta };
  }

  /* ============================================================
     5. KaTeX 可选增强
     ============================================================ */

  function ensureKatex() {
    if (state.opts.katex === false) return;
    if (state.katexLoaded || window.katex) { state.katexLoaded = true; return; }
    /* 先本地、再 CDN：本地文件读取失败（被删 / 路径不对）时自动换下一个来源。 */
    var sources = [KATEX.local, KATEX.cdn];
    var tried = 0;

    function attempt() {
      if (tried >= sources.length) { state.katexFailed = true; return; }
      var src = sources[tried++];
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = src.css;
      document.head.appendChild(link);

      var script = document.createElement("script");
      script.async = true;
      script.src = src.js;
      script.onload = function () {
        if (window.katex) {
          state.katexLoaded = true;
          state.katexSource = src === KATEX.local ? "local" : "cdn";
          upgradeMath(document);
          return;
        }
        attempt();
      };
      script.onerror = attempt;
      document.head.appendChild(script);
    }

    attempt();
  }

  function upgradeMath(root) {
    if (!state.katexLoaded || !window.katex) return;
    $$(".tex[data-tex]", root).forEach(function (el) {
      var tex = el.getAttribute("data-tex");
      var display = el.classList.contains("tex-block");
      try {
        var span = document.createElement(display ? "div" : "span");
        span.innerHTML = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
        el.parentNode.replaceChild(span, el);
      } catch (e) { /* 保留降级样式 */ }
    });
  }

  /* ============================================================
     6. 笔记读取
     ============================================================ */

  function fetchNote(file) {
    if (state.mdCache[file]) return Promise.resolve(state.mdCache[file]);
    return fetch(encodeURI(file), { cache: "no-cache" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      return res.text();
    }).then(function (text) {
      state.mdCache[file] = text;
      return text;
    });
  }

  function errorCard(title, html) {
    return '<div class="panel mech err-card"><div class="panel-title">▸ ' + esc(title) + "</div>" + html + "</div>";
  }

  /* ============================================================
     7. 评分
     ============================================================ */

  function normFill(v) {
    var s = String(v == null ? "" : v).trim().replace(/\s+/g, " ");
    return state.opts.fillCaseSensitive ? s : s.toLowerCase();
  }

  function gradeOne(q, given) {
    var type = q.type || "choice";
    if (type === "choice") {
      var idx = q.answer;
      if (typeof idx === "string" && /^[A-Za-z]$/.test(idx.trim())) idx = idx.trim().toUpperCase().charCodeAt(0) - 65;
      return { auto: true, correct: given != null && Number(given) === Number(idx), expected: Number(idx) };
    }
    if (type === "judge") {
      var want = (q.answer === true || q.answer === "true" || q.answer === "对" || q.answer === "正确" || q.answer === 1);
      return { auto: true, correct: given != null && Boolean(given) === want, expected: want };
    }
    if (type === "fill") {
      var accepted = String(q.answer == null ? "" : q.answer).split("|").map(normFill).filter(function (s) { return s.length; });
      var got = normFill(given);
      return { auto: true, correct: got.length > 0 && accepted.indexOf(got) >= 0, expected: q.answer };
    }
    return { auto: false, correct: null, expected: q.answer };
  }

  /* ============================================================
     8. 视图：仪表盘
     ============================================================ */

  function viewHome() {
    var d = state.data;
    var ov = overallProgress();
    var avg = scoreAverage();
    var taken = (d.chapters || []).filter(function (ch) { return state.scores[ch.id]; }).length;

    var html = '<div class="wrap">';
    html += '<div class="panel mech">' +
      '<div class="hud"><span class="dot">◆</span> SUBJECT / ' + esc(d.meta && d.meta.subject ? d.meta.subject : "未命名科目") + '</div>' +
      '<h1 class="h1">' + esc(d.meta && d.meta.subject ? d.meta.subject : "学习门户") + ' <span class="accent">学习门户</span></h1>' +
      '<div class="sub">' + (d.chapters || []).length + ' 章 · ' + ov.total + ' 节 · 生成于 ' + esc((d.meta && d.meta.generatedAt) || "—") + '</div>' +
      "</div>";

    html += '<div class="stat-row">' +
      stat("SECTORS", (d.chapters || []).length, "") +
      stat("PROGRESS", ov.pct + "%", "ok") +
      stat("SECTIONS", ov.done + " / " + ov.total, "") +
      stat("AVG SCORE", avg == null ? "—" : avg + " / 100", avg == null ? "" : (avg >= 60 ? "ok" : "warn")) +
      stat("TESTS TAKEN", taken + " / " + (d.chapters || []).length, "") +
      "</div>";

    html += '<div class="hud" style="margin:22px 0 12px"><span class="dot">▸</span> CHAPTER GRID</div>';
    html += '<div class="cards">';
    (d.chapters || []).forEach(function (ch) {
      var p = chapterProgress(ch);
      var sc = state.scores[ch.id];
      var lamp = p.pct === 100 ? "done" : (p.done > 0 ? "wip" : "");
      html += '<div class="ch-card">' +
        '<div class="ch-top"><span class="ch-no">SECTOR ' + String(ch.no).padStart(2, "0") + "</span>" +
        '<span class="lamp ' + lamp + '"></span></div>' +
        '<div class="ch-name">' + esc(ch.title) + "</div>" +
        '<div class="ch-brief">' + esc(ch.brief || "") + "</div>" +
        '<div class="bar"><div class="bar-fill' + (p.pct === 100 ? " full" : "") + '" style="width:' + p.pct + '%"></div></div>' +
        '<div class="ch-foot">' +
        '<span class="mono" style="font-size:.72rem;color:var(--dim)">' + p.done + "/" + p.total + " 节</span>" +
        '<span class="ch-score">' + (sc && typeof sc.best === "number" ? "SCORE " + sc.best + "/100" : "未测试") + "</span>" +
        '<span class="spacer"></span>' +
        '<button class="btn primary mono" data-go="#/read/' + (firstSectionOf(ch.id) || "") + '">继续学习 ▸</button>' +
        '<button class="btn ghost mono" data-go="#/test/' + ch.id + '">测试</button>' +
        "</div></div>";
    });
    html += "</div>";

    if (state.last && state.last.route) {
      html += '<div class="panel" style="margin-top:18px"><div class="panel-title">▸ 最近学习</div>' +
        '<div class="navrow"><button class="btn" data-go="' + escAttr(state.last.route) + '">回到 ' + esc(state.last.label || state.last.route) + "</button>" +
        '<span class="q-note">' + esc(state.last.at || "") + "</span></div></div>";
    }

    html += '<div class="panel" style="margin-top:18px"><div class="panel-title">▸ 门户说明</div>' +
      '<div class="q-note">本门户与你在 Typora 等编辑器里读的笔记共用同一批 Markdown 文件：网页实时读取笔记正文，' +
      '在编辑器里改完笔记，刷新本页即可看到。进度、练习作答与测试成绩保存在本浏览器的 localStorage 中（前缀 <code class="ic">notes_portal:</code>）。</div>' +
      '<div class="navrow" style="margin-top:12px">' +
      '<button class="btn danger mono" id="reset-btn">重置进度与成绩</button>' +
      "</div></div>";

    html += "</div>";
    return html;
  }

  function stat(k, v, cls) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || "") + '">' + esc(v) + "</div></div>";
  }

  /* ============================================================
     9. 视图：阅读
     ============================================================ */

  function scrollToPendingAnchor() {
    var id = state.pendingAnchor;
    if (!id) return;
    var target = document.getElementById ? document.getElementById(id) : null;
    if (!target && document.querySelectorAll) {
      /* Typora / GitHub 对 ▸、·、： 等符号的锚点处理不同：退而比较只含字母数字的形式。 */
      var want = looseKey(id);
      var heads = document.querySelectorAll("#main h1[id], #main h2[id], #main h3[id], #main h4[id], #main h5[id], #main h6[id]");
      for (var i = 0; i < heads.length && !target; i++) if (looseKey(heads[i].id) === want) target = heads[i];
    }
    if (!target) return;
    state.pendingAnchor = null;
    if (target.scrollIntoView) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function viewSheet(cid) {
    var ch = state.index.chapterOf[cid];
    var main = $("#main");
    if (!ch || !ch.sheet || !ch.sheet.file) {
      main.innerHTML = '<div class="read-wrap">' + errorCard("这一章没有速查页", "<p>在 <code class=\"ic\">notes_data.js</code> 的章条目里加 <code class=\"ic\">sheet: { file: \"/Cha_X 章名/CX 速查.md\" }</code>。</p>") + "</div>";
      return;
    }
    setCrumbs('<a href="#/home">总览</a><span class="sep">/</span><span>SECTOR ' + String(ch.no).padStart(2, "0") + '</span><span class="sep">/</span><span>本章速查</span>');
    main.innerHTML = '<div class="read-wrap"><div class="loading">载入速查</div></div>';
    return fetchNote(ch.sheet.file).then(function (raw) {
      var split = stripFrontmatter(raw);
      var body = renderMarkdown(split.body, { file: ch.sheet.file, chapterNo: ch.no, title: "C" + ch.no + " 速查" });
      main.innerHTML = '<div class="read-wrap"><div class="panel mech"><div class="md">' + body + "</div></div>" +
        '<div class="panel"><div class="navrow"><span class="spacer"></span><button class="btn primary" data-go="#/test/' + ch.id + '">进入本章测试 ▸</button></div></div></div>';
      postRender(main);
      scrollToPendingAnchor();
    }).catch(function (err) {
      main.innerHTML = '<div class="read-wrap">' + errorCard("无法读取速查页", "<p><code class=\"ic\">" + esc(ch.sheet.file) + "</code>：" + esc(err.message || String(err)) + "</p>") + "</div>";
    });
  }

  function viewRead(sid) {
    var found = state.index.sections[sid];
    if (!found) {
      return errorCard("找不到这一节", '<p>数据里有 <code class="ic">' + esc(sid) + "</code> 这个 id，但目录里没有对应条目。请检查 <code class=\"ic\">web/notes_data.js</code>。</p>");
    }
    var ch = found.chapter, sec = found.section;

    setCrumbs(
      '<a href="#/home">总览</a><span class="sep">/</span>' +
      '<span>SECTOR ' + String(ch.no).padStart(2, "0") + "</span><span class=\"sep\">/</span>" +
      "<span>" + esc(sec.title) + "</span>"
    );

    var main = $("#main");
    main.innerHTML = '<div class="read-wrap"><div class="loading">载入笔记</div></div>';

    return fetchNote(sec.file).then(function (raw) {
      var split = stripFrontmatter(raw);
      var ctx = { file: sec.file, chapterNo: ch.no, title: sec.title };
      var body = renderMarkdown(split.body, ctx);

      var h = '<div class="read-wrap">';

      h += '<div class="panel mech">' +
        '<div class="note-meta">' +
        '<span class="chip accent">SECTOR ' + String(ch.no).padStart(2, "0") + "-" + String(sec.no).padStart(2, "0") + "</span>" +
        (split.meta.subject ? '<span class="chip">' + esc(split.meta.subject) + "</span>" : "") +
        (split.meta.status ? '<span class="chip">状态：' + esc(split.meta.status) + "</span>" : "") +
        (split.meta.tags ? '<span class="chip">' + esc(split.meta.tags) + "</span>" : "") +
        '<span class="spacer"></span>' +
        '<button class="btn ghost mono" id="reload-btn">重新载入</button>' +
        "</div>" +
        '<div class="md" id="note-body">' + body + "</div>" +
        (conceptNames(sec).length
          ? '<div class="hud" style="margin-top:22px"><span class="dot">▸</span> 本节的概念小节</div><div class="badges">' +
            (Array.isArray(sec.concepts) ? sec.concepts : []).concat(Array.isArray(sec.concepts) ? [] : conceptNames(sec)).map(function (c) {
              if (c && typeof c === "object") {
                return '<a class="badge" href="#" data-anchor="' + escAttr(slugify("概念 " + c.n + "：" + c.name)) + '">' + esc(c.name) + "</a>";
              }
              return '<span class="badge">' + esc(c) + "</span>";
            }).join("") +
            "</div>"
          : "") +
        "</div>";

      h += practiceCard(ch, sec);

      var list = ch.sections || [];
      var idx = list.findIndex(function (s) { return s.id === sid; });
      var prev = idx > 0 ? list[idx - 1] : null;
      var next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
      var done = !!state.progress[sid];

      h += '<div class="panel"><div class="navrow">' +
        (prev ? '<button class="btn" data-go="#/read/' + prev.id + '">◂ ' + esc(prev.title) + "</button>" : '<button class="btn" disabled>已是第一节</button>') +
        '<span class="spacer"></span>' +
        '<button class="btn ' + (done ? "ok" : "primary") + ' mono" id="mark-btn">' + (done ? "✔ 已标记完成" : "标记本节完成") + "</button>" +
        '<span class="spacer"></span>' +
        (next ? '<button class="btn" data-go="#/read/' + next.id + '">' + esc(next.title) + " ▸</button>" : '<button class="btn" data-go="#/test/' + ch.id + '">进入本章测试 ▸</button>') +
        "</div></div>";

      h += "</div>";
      main.innerHTML = h;
      postRender(main);
      bindPractice(ch, sec);
      scrollToPendingAnchor();
      remember("#/read/" + sid, "C" + ch.no + " Sec_" + sec.no + " " + sec.title);

      var markBtn = $("#mark-btn");
      if (markBtn) markBtn.onclick = function () {
        state.progress[sid] = !state.progress[sid];
        if (!state.progress[sid]) delete state.progress[sid];
        saveProgress();
        renderNav();
        render();
        toast(state.progress[sid] ? "已标记完成" : "已取消完成标记", "ok");
      };
      var reload = $("#reload-btn");
      if (reload) reload.onclick = function () {
        delete state.mdCache[sec.file];
        render();
        toast("已重新载入笔记", "ok");
      };
    }).catch(function (err) {
      main.innerHTML = '<div class="read-wrap">' + errorCard("无法读取笔记文件", 
        "<p>笔记文件：<code class=\"ic\">" + esc(sec.file) + "</code></p>" +
        "<p>错误：<code class=\"ic\">" + esc(err.message || String(err)) + "</code></p>" +
        "<ol><li>确认文件真实存在于笔记根目录下，且文件名与 <code class=\"ic\">notes_data.js</code> 中逐字符一致（含空格与全半角）。</li>" +
        "<li>确认是通过 <code class=\"ic\">启动学习服务器.bat</code> 打开的页面，而不是直接双击 <code class=\"ic\">index.html</code>（<code class=\"ic\">file://</code> 下浏览器禁止读取本地文件）。</li>" +
        "<li>按 Ctrl+Shift+R 强制刷新后重试。</li></ol>") + "</div>";
    });
  }

  function practiceCard(ch, sec) {
    var quiz = sec.quiz || [];
    if (!quiz.length) {
      return '<div class="panel"><div class="panel-title">▸ 本节练习</div><div class="q-note">本节在 <code class="ic">notes_data.js</code> 中还没有练习数据。若笔记里已有练习，请把题目同步进 <code class="ic">quiz</code> 数组。</div></div>';
    }
    var rec = state.quiz[sec.id];
    var h = '<div class="panel"><div class="panel-title">▸ 本节练习 <span class="hud">PRACTICE / ' + quiz.length + "</span></div>";
    h += '<div id="practice">';
    quiz.forEach(function (q, qi) { h += quizItem(q, qi, rec); });
    h += "</div>";
    h += '<div class="q-actions"><button class="btn primary mono" id="prac-submit">提交作答</button>' +
      '<button class="btn ghost mono" id="prac-clear">清空重做</button>' +
      '<span class="q-note" id="prac-note"></span></div>';
    h += "</div>";
    return h;
  }

  function quizItem(q, qi, rec) {
    var type = q.type || "choice";
    var saved = rec && rec.answers ? rec.answers[qi] : undefined;
    var graded = rec && rec.graded;
    var res = graded ? gradeOne(q, saved) : null;
    var h = '<div class="qitem" data-qi="' + qi + '">';
    h += '<div class="q-head"><span class="q-no">Q' + (qi + 1) + '</span>' +
      '<span class="chip">' + esc(typeLabel(type)) + "</span>" +
      '<span class="q-score">' + (graded && res && res.auto ? (res.correct ? "✔ 正确" : "✘ 错误") : "") + "</span></div>";
    h += '<div class="q-body md">' + renderMarkdown(q.question || "", {}) + "</div>";
    h += qInputs(q, qi, saved, graded, res);
    if (graded) h += verdict(res, q, type);
    h += "</div>";
    return h;
  }

  function typeLabel(t) {
    return { choice: "选择", judge: "判断", fill: "填空", calc: "计算", subjective: "主观" }[t] || t;
  }

  function qInputs(q, qi, saved, graded, res) {
    var type = q.type || "choice";
    var dis = graded ? " disabled" : "";
    if (type === "choice") {
      var opts = q.options || [];
      return '<div class="q-opts">' + opts.map(function (o, oi) {
        var cls = "opt" + (graded ? " locked" : "");
        if (graded && res.expected === oi) cls += " right";
        if (graded && saved != null && Number(saved) === oi && res.expected !== oi) cls += " wrong";
        return '<label class="' + cls + '"><input type="radio" name="q' + qi + '" value="' + oi + '"' +
          (saved != null && Number(saved) === oi ? " checked" : "") + dis + ">" +
          '<span class="opt-key">' + String.fromCharCode(65 + oi) + '</span><span>' + inline(o, {}) + "</span></label>";
      }).join("") + "</div>";
    }
    if (type === "judge") {
      var want = (q.answer === true || q.answer === "true" || q.answer === "对" || q.answer === "正确" || q.answer === 1);
      return '<div class="judge-row">' +
        judgeOpt(qi, "true", "✓ 正确", saved, graded, want) +
        judgeOpt(qi, "false", "✗ 错误", saved, graded, want) + "</div>";
    }
    if (type === "fill") {
      var cls2 = "inp" + (graded ? (res.correct ? " right" : " wrong") : "");
      return '<input class="' + cls2 + '" type="text" data-qi="' + qi + '" value="' + escAttr(saved == null ? "" : saved) + '"' + dis + ' placeholder="在此填写答案">';
    }
    return '<textarea class="ta" data-qi="' + qi + '"' + dis + ' placeholder="在此作答（计算过程 / 论述）">' + esc(saved == null ? "" : saved) + "</textarea>";
  }

  function judgeOpt(qi, value, label, saved, graded, want) {
    var isTrue = value === "true";
    var cls = "opt" + (graded ? " locked" : "");
    if (graded && want === isTrue) cls += " right";
    if (graded && saved != null && Boolean(saved) === isTrue && want !== isTrue) cls += " wrong";
    return '<label class="' + cls + '"><input type="radio" name="q' + qi + '" value="' + value + '"' +
      (saved != null && Boolean(saved) === isTrue ? " checked" : "") + (graded ? " disabled" : "") +
      "><span>" + esc(label) + "</span></label>";
  }

  function verdict(res, q, type) {
    if (type === "calc" || type === "subjective") {
      return '<div class="verdict"><div class="vt">参考答案</div>' +
        '<div class="va">' + inline(String(q.answer == null ? "" : q.answer), {}) + "</div>" +
        (q.analysis ? '<div class="vx">解析：' + inline(q.analysis, {}) + "</div>" : "") + "</div>";
    }
    var cls = res && res.correct ? "right" : "wrong";
    var label = res && res.correct ? "✔ 回答正确" : "✘ 回答错误";
    return '<div class="verdict ' + cls + '"><div class="vt">' + label + "</div>" +
      (res && !res.correct ? '<div class="va">正确答案：' + esc(answerText(q, type)) + "</div>" : "") +
      (q.analysis ? '<div class="vx">解析：' + inline(q.analysis, {}) + "</div>" : "") + "</div>";
  }

  function answerText(q, type) {
    if (type === "choice") {
      var i = q.answer;
      if (typeof i === "string" && /^[A-Za-z]$/.test(i.trim())) return i.trim().toUpperCase();
      return String.fromCharCode(65 + num(i, 0));
    }
    if (type === "judge") {
      var want = (q.answer === true || q.answer === "true" || q.answer === "对" || q.answer === "正确" || q.answer === 1);
      return want ? "正确" : "错误";
    }
    return String(q.answer == null ? "" : q.answer);
  }

  function collectAnswers(root) {
    var answers = [];
    $$(".qitem", root).forEach(function (item) {
      var qi = Number(item.getAttribute("data-qi"));
      var radio = $('input[type="radio"]:checked', item);
      var text = $("textarea, input.inp", item);
      if (radio) {
        var v = radio.value;
        answers[qi] = (v === "true") ? true : (v === "false") ? false : Number(v);
      } else if (text) {
        answers[qi] = text.value;
      } else {
        answers[qi] = null;
      }
    });
    return answers;
  }

  function bindPractice(ch, sec) {
    var submit = $("#prac-submit");
    var clear = $("#prac-clear");
    var root = $("#practice");
    if (!submit || !root) return;
    submit.onclick = function () {
      var answers = collectAnswers(root);
      state.quiz[sec.id] = { answers: answers, graded: true, at: new Date().toISOString() };
      saveQuiz();
      var auto = 0, right = 0;
      (sec.quiz || []).forEach(function (q, qi) {
        var r = gradeOne(q, answers[qi]);
        if (r.auto) { auto++; if (r.correct) right++; }
      });
      render();
      toast("已判分：" + right + " / " + auto + " 题正确", right === auto ? "ok" : "warn");
    };
    clear.onclick = function () {
      delete state.quiz[sec.id];
      saveQuiz();
      render();
    };
    var note = $("#prac-note");
    if (note && state.quiz[sec.id] && state.quiz[sec.id].graded) note.textContent = "已作答，可清空后重做。";
  }

  /* ============================================================
     10. 视图：章末测试
     ============================================================ */

  function viewTest(cid) {
    var ch = state.index.chapterOf[cid];
    if (!ch || !ch.test) {
      return errorCard("找不到这一章的测试", "<p>请检查 <code class=\"ic\">notes_data.js</code> 中该章的 <code class=\"ic\">test</code> 字段。</p>");
    }
    setCrumbs('<a href="#/home">总览</a><span class="sep">/</span><span>SECTOR ' + String(ch.no).padStart(2, "0") + '</span><span class="sep">/</span><span>章末测试</span>');

    var main = $("#main");
    main.innerHTML = '<div class="read-wrap"><div class="loading">载入测试</div></div>';

    return fetchNote(ch.test.file).then(function (raw) {
      renderTestForm(ch, stripFrontmatter(raw).body);
    }).catch(function () {
      renderTestForm(ch, "");
    });
  }

  function renderTestForm(ch, noteBody) {
    var test = ch.test;
    var questions = test.questions || [];
    var total = num(test.total, 100);
    var rec = state.scores[ch.id];
    var html = '<div class="read-wrap">';

    html += '<div class="panel mech">' +
      '<div class="hud"><span class="dot">◆</span> EXAM / SECTOR ' + String(ch.no).padStart(2, "0") + '</div>' +
      '<h1 class="h1">' + esc(ch.title) + " <span class=\"accent\">章末测试</span></h1>" +
      '<div class="sub">满分 ' + total + " 分 · 共 " + questions.length + " 题" +
      (rec && typeof rec.best === "number" ? " · 历史最佳 <b style=\"color:var(--ok)\">" + rec.best + "</b> 分，上次 " + rec.last + " 分" : "") +
      "</div></div>";

    if (rec && typeof rec.best === "number") {
      html += '<div class="panel"><div class="panel-title">▸ 历史成绩</div>' +
        '<div class="score-list">' +
        '<div class="row"><span class="k">最佳</span><span class="v ok">' + rec.best + " / " + total + "</span></div>" +
        '<div class="row"><span class="k">最近一次</span><span class="v">' + rec.last + " / " + total + "</span></div>" +
        '<div class="row"><span class="k">重测次数</span><span class="v">' + ((rec.history || []).length) + "</span></div>" +
        "</div>" +
        '<div class="navrow" style="margin-top:12px"><button class="btn primary mono" id="retake-btn">重新测试</button>' +
        (noteBody ? '<button class="btn ghost mono" data-go="#/read/' + firstSectionOf(ch.id) + '">回到本章笔记</button>' : "") +
        "</div></div>";
    }

    html += '<div class="panel"><div id="test-form">';
    if (!questions.length) {
      html += '<div class="q-note">本章测试还没有题目数据。请把 <code class="ic">' + esc(test.file) + '</code> 中的题目同步进 <code class="ic">notes_data.js</code> 的 <code class="ic">test.questions</code>。</div>';
    } else {
      questions.forEach(function (q, qi) { html += testItem(q, qi); });
    }
    html += "</div>";
    html += '<div class="q-actions"><button class="btn primary mono" id="test-submit">交卷并判分</button>' +
      '<button class="btn ghost mono" id="test-clear">清空作答</button>' +
      '<span class="q-note">客观题自动判分；计算与主观题按评分要点自评。</span></div>';
    html += "</div>";

    html += '<div id="report"></div>';
    html += "</div>";

    $("#main").innerHTML = html;
    postRender($("#main"));

    var submit = $("#test-submit");
    if (submit) submit.onclick = function () { gradeTest(ch); };
    var clear = $("#test-clear");
    if (clear) clear.onclick = function () {
      if (state.testDraft) state.testDraft = null;
      renderTestForm(ch, "");
      toast("已清空作答", "ok");
    };
    var retake = $("#retake-btn");
    if (retake) retake.onclick = function () { renderTestForm(ch, ""); window.scrollTo(0, 0); };
  }

  function testItem(q, qi) {
    var type = q.type || "choice";
    var h = '<div class="qitem" data-qi="' + qi + '" data-score="' + num(q.score, 0) + '">';
    h += '<div class="q-head"><span class="q-no">' + esc(q.id || ("Q" + (qi + 1))) + '</span>' +
      '<span class="chip">' + esc(typeLabel(type)) + '</span>' +
      '<span class="q-score">' + num(q.score, 0) + " 分</span></div>";
    h += '<div class="q-body md">' + renderMarkdown(q.question || "", {}) + "</div>";
    h += qInputs(q, qi, undefined, false, null);
    h += "</div>";
    return h;
  }

  function gradeTest(ch) {
    var test = ch.test;
    var questions = test.questions || [];
    var total = num(test.total, 100);
    var root = $("#test-form");
    var answers = collectAnswers(root);
    var autoScore = 0, selfMax = 0, correctCount = 0, autoCount = 0, wrong = [];

    questions.forEach(function (q, qi) {
      var r = gradeOne(q, answers[qi]);
      var sc = num(q.score, 0);
      if (r.auto) {
        autoCount++;
        if (r.correct) { autoScore += sc; correctCount++; } else { wrong.push(q.id || ("Q" + (qi + 1))); }
      } else {
        selfMax += sc;
      }
    });

    var html = '<div class="panel mech"><div class="panel-title">▸ 成绩单</div>';
    html += '<div class="score-head">';
    html += '<div class="ring-wrap"><svg class="ring" id="ring" viewBox="0 0 120 120">' +
      '<circle class="ring-bg" cx="60" cy="60" r="52"></circle>' +
      '<circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>' +
      '</svg><div class="ring-val"><span class="n" id="ring-n">0</span><span class="d">SCORE</span></div></div>';
    html += '<div class="score-list">' +
      '<div class="row"><span class="k">客观题得分</span><span class="v ok">' + autoScore + " / " + (total - selfMax) + "</span></div>" +
      '<div class="row"><span class="k">客观题正确</span><span class="v">' + correctCount + " / " + autoCount + "</span></div>" +
      '<div class="row"><span class="k">主观题满分</span><span class="v">' + selfMax + "</span></div>" +
      (wrong.length ? '<div class="row"><span class="k">答错的题号</span><span class="v bad">' + esc(wrong.join("、")) + "</span></div>" : "") +
      "</div></div>";

    if (selfMax > 0) {
      html += '<div class="rule"></div><div class="hud"><span class="dot">▸</span> 自评区（计算题 / 主观题）</div>';
      questions.forEach(function (q, qi) {
        var r = gradeOne(q, answers[qi]);
        if (r.auto) return;
        html += '<div class="qitem"><div class="q-head"><span class="q-no">' + esc(q.id || ("Q" + (qi + 1))) + '</span>' +
          '<span class="q-score">满分 ' + num(q.score, 0) + " 分</span></div>" +
          '<div class="verdict"><div class="vt">参考答案与评分要点</div>' +
          '<div class="va">' + inline(String(q.answer == null ? "" : q.answer), {}) + "</div>" +
          (q.analysis ? '<div class="vx">' + inline(q.analysis, {}) + "</div>" : "") + "</div>" +
          '<div class="selfscore"><label class="q-note" for="self-' + qi + '">自评得分</label>' +
          '<input class="inp" type="number" min="0" max="' + num(q.score, 0) + '" step="1" id="self-' + qi + '" data-self="' + qi + '" data-max="' + num(q.score, 0) + '" value="0">' +
          '<span class="max">/ ' + num(q.score, 0) + " 分</span></div></div>";
      });
    }

    html += '<div class="rule"></div><div class="navrow">' +
      '<button class="btn primary mono" id="self-save">保存自评分并记录成绩</button>' +
      '<button class="btn ghost mono" id="report-toggle">展开逐题解析</button>' +
      '<button class="btn ghost mono" id="retake2">再测一次</button>' +
      "</div>";
    html += '<div id="detail" style="display:none;margin-top:14px">';
    questions.forEach(function (q, qi) {
      var r = gradeOne(q, answers[qi]);
      var cls = r.auto ? (r.correct ? "right" : "wrong") : "";
      html += '<div class="verdict ' + cls + '" style="margin-top:10px">' +
        '<div class="vt">' + esc(q.id || ("Q" + (qi + 1))) + " · " + esc(typeLabel(q.type || "choice")) + " · " + num(q.score, 0) + " 分" +
        (r.auto ? (r.correct ? " · ✔ 正确" : " · ✘ 错误") : " · 自评") + "</div>" +
        (r.auto && !r.correct ? '<div class="va">你的作答：' + esc(String(answers[qi] == null ? "（未作答）" : (typeof answers[qi] === "boolean" ? (answers[qi] ? "正确" : "错误") : answers[qi]))) + "　正确答案：" + esc(answerText(q, q.type || "choice")) + "</div>" : "") +
        (!r.auto ? '<div class="va">你的作答：' + esc(String(answers[qi] == null ? "（未作答）" : answers[qi])) + "</div>" : "") +
        (q.analysis ? '<div class="vx">解析：' + inline(q.analysis, {}) + "</div>" : "") +
        "</div>";
    });
    html += "</div></div>";

    var report = $("#report");
    report.innerHTML = html;
    postRender(report);

    var current = autoScore;
    var circumference = 326.7;

    function paint(score) {
      var pct = clamp(score / total, 0, 1);
      var ring = $("#ring");
      if (ring) {
        ring.classList.toggle("good", pct >= .6);
        ring.classList.toggle("bad", pct < .6);
      }
      var fg = $("#ring-fg");
      if (fg) fg.setAttribute("stroke-dashoffset", String(circumference * (1 - pct)));
      var n = $("#ring-n");
      if (n) n.textContent = Math.round(score);
    }
    paint(current);

    var totalSelf = 0;
    function refreshSelf() {
      totalSelf = 0;
      $$("input[data-self]").forEach(function (inp) {
        var max = num(inp.getAttribute("data-max"), 0);
        var v = clamp(num(inp.value, 0), 0, max);
        inp.value = v;
        totalSelf += v;
      });
      paint(current + totalSelf);
    }
    $$("input[data-self]").forEach(function (inp) { inp.oninput = refreshSelf; });
    refreshSelf();

    var saveBtn = $("#self-save");
    if (saveBtn) saveBtn.onclick = function () {
      var final = Math.round(current + totalSelf);
      var prev = state.scores[ch.id] || { best: 0, last: 0, history: [] };
      var entry = { at: new Date().toISOString(), score: final, auto: current, self: totalSelf };
      state.scores[ch.id] = {
        best: Math.max(num(prev.best, 0), final),
        last: final,
        history: (prev.history || []).concat([entry]).slice(-20)
      };
      saveScores();
      toast("已记录成绩：" + final + " / " + total + " 分", final >= total * 0.6 ? "ok" : "warn");
      renderNav();
    };

    var toggle = $("#report-toggle");
    if (toggle) toggle.onclick = function () {
      var d = $("#detail");
      var show = d.style.display === "none";
      d.style.display = show ? "block" : "none";
      toggle.textContent = show ? "收起逐题解析" : "展开逐题解析";
    };
    var again = $("#retake2");
    if (again) again.onclick = function () { renderTestForm(ch, ""); window.scrollTo(0, 0); };

    report.scrollIntoView({ behavior: "smooth", block: "start" });
    remember("#/test/" + ch.id, "C" + ch.no + " 测试");
  }

  /* ============================================================
     11. 视图：图谱 / 搜索
     ============================================================ */

  function viewGraph() {
    setCrumbs('<a href="#/home">总览</a><span class="sep">/</span><span>知识图谱</span>');
    var links = state.data.links || [];
    var nodes = {};
    allSections().forEach(function (e) {
      conceptNames(e.section).forEach(function (a) { nodes[a] = { title: a, sid: e.section.id, ch: e.chapter.no }; });
    });
    var names = Object.keys(nodes);
    if (!names.length) {
      return '<div class="wrap"><div class="panel"><div class="panel-title">▸ 知识图谱</div>' +
        '<div class="q-note">还没有图谱数据。请在 <code class="ic">notes_data.js</code> 顶层维护 <code class="ic">links</code> 数组（每条是一对概念小节标题），并在各节的 <code class="ic">concepts</code> 中列出概念小节。</div></div></div>';
    }
    var W = 900, H = 620, cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 90;
    var pos = {};
    names.forEach(function (n, i) {
      var a = (i / names.length) * Math.PI * 2 - Math.PI / 2;
      pos[n] = { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) };
    });
    var svg = '<svg class="graph" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="概念小节关系图">';
    links.forEach(function (pair) {
      if (!pair || pair.length < 2) return;
      var a = pos[pair[0]], b = pos[pair[1]];
      if (!a || !b) return;
      svg += '<line class="gedge" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) + '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '"></line>';
    });
    names.forEach(function (n) {
      var p = pos[n];
      var label = n.length > 14 ? n.slice(0, 13) + "…" : n;
      svg += '<g class="gnode" data-go="#/read/' + nodes[n].sid + '" style="cursor:pointer">' +
        '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="7"></circle>' +
        '<text x="' + p.x.toFixed(1) + '" y="' + (p.y - 13).toFixed(1) + '" text-anchor="middle">' + esc(label) + "</text></g>";
    });
    svg += "</svg>";

    return '<div class="wrap"><div class="panel mech"><div class="hud"><span class="dot">◆</span> KNOWLEDGE GRAPH</div>' +
      '<h1 class="h1">概念小节 <span class="accent">关系图</span></h1>' +
      '<div class="sub">' + names.length + " 个节点 · " + links.length + " 条连接 · 数据来自 <code class=\"ic\">notes_data.js</code> 的 <code class=\"ic\">links</code>。点击节点跳到对应小节。</div>" +
      '<div class="rule"></div>' + svg + "</div></div>";
  }

  function viewSearch() {
    setCrumbs('<a href="#/home">总览</a><span class="sep">/</span><span>搜索</span>');
    return '<div class="wrap"><div class="panel mech">' +
      '<div class="hud"><span class="dot">◆</span> FULL-TEXT SEARCH</div>' +
      '<h1 class="h1">搜索 <span class="accent">笔记</span></h1>' +
      '<div class="sub">检索范围：全部节笔记与概念小节的标题、目录、正文（正文首次检索时按需读取）。</div>' +
      '<div class="rule"></div>' +
      '<div class="search-box"><input class="inp" id="search-input" type="search" placeholder="输入关键词，例如「矩阵」「递归」「泰勒展开」" autofocus>' +
      '<button class="btn primary mono" id="search-btn">搜索</button></div>' +
      '<div id="search-results"><div class="q-note">输入关键词后回车或点击搜索。</div></div>' +
      "</div></div>";
  }

  function runSearch(query) {
    var box = $("#search-results");
    var q = String(query || "").trim();
    if (!q) { box.innerHTML = '<div class="q-note">输入关键词后回车或点击搜索。</div>'; return; }
    box.innerHTML = '<div class="loading">检索中</div>';
    var lower = q.toLowerCase();

    var jobs = allSections().map(function (e) {
      var key = e.section.file;
      if (state.mdCache[key]) return Promise.resolve([e, state.mdCache[key]]);
      return fetch(encodeURI(key), { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) { state.mdCache[key] = t; return [e, t]; })
        .catch(function () { return [e, ""]; });
    });

    Promise.all(jobs).then(function (all) {
      var hits = [];
      all.forEach(function (pair) {
        var e = pair[0], text = pair[1] || "";
        var where = [];
        if (e.section.title.toLowerCase().indexOf(lower) >= 0) where.push("标题");
        conceptNames(e.section).forEach(function (a) { if (a.toLowerCase().indexOf(lower) >= 0) where.push("概念小节"); });
        var idx = text.toLowerCase().indexOf(lower);
        var snippet = "";
        if (idx >= 0) {
          where.push("正文");
          var from = Math.max(0, idx - 60), to = Math.min(text.length, idx + q.length + 110);
          snippet = text.slice(from, to).replace(/\s+/g, " ");
        }
        if (where.length) hits.push({ e: e, where: Array.from(new Set(where)).join(" · "), snippet: snippet });
      });

      if (!hits.length) { box.innerHTML = '<div class="q-note">没有找到包含「' + esc(q) + "」的内容。</div>"; return; }

      box.innerHTML = '<div class="q-note" style="margin-bottom:10px">共 ' + hits.length + " 条结果</div>" + hits.map(function (h) {
        var marked = h.snippet
          ? esc(h.snippet).replace(new RegExp(escapeRe(q), "gi"), function (m) { return "<mark>" + m + "</mark>"; })
          : "";
        return '<div class="sres"><div class="sp">SECTOR ' + String(h.e.chapter.no).padStart(2, "0") + " · " + esc(h.where) + "</div>" +
          '<div class="st"><a href="#/read/' + h.e.section.id + '">' + esc(h.e.section.title) + "</a></div>" +
          (marked ? '<div class="ss">…' + marked + "…</div>" : "") + "</div>";
      }).join("");
    });
  }

  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  /* ============================================================
     12. 导航树 / 面包屑
     ============================================================ */

  function renderNav() {
    var d = state.data;
    var body = $("#nav-body");
    var activeSid = state.route.name === "read" ? state.route.id : null;
    var activeCid = state.route.name === "test" ? state.route.id : null;

    var html = "";
    (d.chapters || []).forEach(function (ch) {
      var p = chapterProgress(ch);
      var contains = (ch.sections || []).some(function (s) { return s.id === activeSid; }) || ch.id === activeCid;
      html += '<div class="nav-ch' + (contains ? " open" : "") + '" data-cid="' + ch.id + '">' +
        '<button class="nav-ch-btn" data-toggle="' + ch.id + '">' +
        '<span class="caret">▶</span>' +
        '<span class="lamp ' + (p.pct === 100 ? "done" : (p.done > 0 ? "wip" : "")) + '"></span>' +
        '<span class="nav-ch-name">' + esc(ch.title) + "</span>" +
        '<span class="hud">' + p.pct + "%</span>" +
        "</button>" +
        '<div class="nav-secs">' +
        (ch.sections || []).map(function (s) {
          return '<a class="nav-sec' + (s.id === activeSid ? " active" : "") + '" href="#/read/' + s.id + '">' +
            '<span class="lamp ' + (state.progress[s.id] ? "done" : "") + '"></span>' +
            '<span class="t">' + esc(s.title) + "</span></a>";
        }).join("") +
        (ch.sheet && ch.sheet.file ? '<a class="nav-test' + (state.route.name === "sheet" && state.route.id === ch.id ? " active" : "") + '" href="#/sheet/' + ch.id + '">▸ 本章速查</a>' : "") +
        '<a class="nav-test' + (ch.id === activeCid ? " active" : "") + '" href="#/test/' + ch.id + '">▸ 章末测试' +
        (state.scores[ch.id] && typeof state.scores[ch.id].best === "number" ? " · " + state.scores[ch.id].best + "分" : "") +
        "</a>" +
        "</div></div>";
    });
    body.innerHTML = html;

    var ov = overallProgress();
    var avg = scoreAverage();
    $("#nav-sub").textContent = (d.chapters || []).length + " 章 · " + ov.done + "/" + ov.total + " 节 · 完成 " + ov.pct + "%" +
      (avg == null ? "" : " · 均分 " + avg);
  }

  function setCrumbs(html) { $("#crumbs").innerHTML = html; }

  function remember(route, label) {
    state.last = { route: route, label: label, at: new Date().toLocaleString() };
    writeLS(LS.last, state.last);
  }

  /* ============================================================
     13. 路由
     ============================================================ */

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/").filter(function (p) { return p.length; });
    if (!parts.length) return { name: "home" };
    if (parts[0] === "read" && parts[1]) return { name: "read", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "test" && parts[1]) return { name: "test", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "sheet" && parts[1]) return { name: "sheet", id: decodeURIComponent(parts[1]) };
    if (parts[0] === "graph") return { name: "graph" };
    if (parts[0] === "search") return { name: "search" };
    return { name: "home" };
  }

  function render() {
    state.route = parseHash();
    var main = $("#main");
    setTopActions("");

    if (state.route.name === "read") {
      viewRead(state.route.id);
    } else if (state.route.name === "test") {
      viewTest(state.route.id);
    } else if (state.route.name === "sheet") {
      viewSheet(state.route.id);
    } else {
      var html;
      if (state.route.name === "graph") html = viewGraph();
      else if (state.route.name === "search") html = viewSearch();
      else html = viewHome();

      main.innerHTML = html;
      postRender(main);

      if (state.route.name === "home") {
        var reset = $("#reset-btn");
        if (reset) reset.onclick = function () {
          modal({
            title: "重置进度与成绩？",
            body: "这会清空已完成的节标记、练习作答与所有测试成绩，且无法撤销。笔记文件不会被改动。",
            ok: "确认重置", danger: true,
            onOk: function () {
              state.progress = {}; state.scores = {}; state.quiz = {}; state.last = null;
              dropLS(LS.progress); dropLS(LS.scores); dropLS(LS.quiz); dropLS(LS.last);
              renderNav(); render();
              toast("已重置", "ok");
            }
          });
        };
      }

      if (state.route.name === "search") {
        var input = $("#search-input");
        var btn = $("#search-btn");
        var lastQ = sessionStorage.getItem("notes_portal:q");
        if (input) {
          input.addEventListener("keydown", function (e) { if (e.key === "Enter") { sessionStorage.setItem("notes_portal:q", input.value); runSearch(input.value); } });
          input.addEventListener("change", function () { sessionStorage.setItem("notes_portal:q", input.value); });
          if (lastQ) { input.value = lastQ; runSearch(lastQ); }
        }
        if (btn) btn.onclick = function () {
          if (input) { sessionStorage.setItem("notes_portal:q", input.value); runSearch(input.value); }
        };
      }
    }

    renderNav();
    closeDrawer();
    if (state.route.name !== "home") window.scrollTo(0, 0);
  }

  function setTopActions(html) { $("#topbar-actions").innerHTML = html; }

  function closeDrawer() {
    $("#nav").classList.remove("open");
    $("#nav-scrim").classList.remove("on");
  }

  /* ============================================================
     14. 全局事件
     ============================================================ */

  document.addEventListener("click", function (e) {
    var anc = e.target.closest("a[data-anchor]");
    if (anc) {
      var href = anc.getAttribute("href");
      state.pendingAnchor = anc.getAttribute("data-anchor");
      if (!href || href === "#" || href === location.hash) {
        e.preventDefault();
        scrollToPendingAnchor();
      }
      return;
    }
    var go = e.target.closest("[data-go]");
    if (go) {
      e.preventDefault();
      var target = go.getAttribute("data-go");
      if (target && target !== "#") location.hash = target;
      return;
    }
    var toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      var btn = toggle.closest(".nav-ch");
      if (btn) btn.classList.toggle("open");
      return;
    }
    var fold = e.target.closest(".callout-fold > .callout-head");
    if (fold) { fold.parentNode.classList.toggle("open"); return; }

    var copy = e.target.closest(".cb-copy");
    if (copy) {
      var cb = copy.closest(".cb");
      var pre = cb ? cb.querySelector("pre") : null;
      copyText(pre ? pre.textContent : "").then(function () { toast("代码已复制", "ok"); }, function () { toast("复制失败，请手动选择", "bad"); });
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var head = e.target.closest && e.target.closest(".callout-fold > .callout-head");
    if (!head) return;
    e.preventDefault();
    head.parentNode.classList.toggle("open");
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        ok ? resolve() : reject(new Error("execCommand failed"));
      } catch (e) { reject(e); }
    });
  }

  $("#menu-btn").onclick = function () {
    $("#nav").classList.toggle("open");
    $("#nav-scrim").classList.toggle("on");
  };
  $("#nav-scrim").onclick = closeDrawer;

  window.addEventListener("hashchange", render);

  /* ============================================================
     15. 启动
     ============================================================ */

  function fatal(title, html) {
    $("#nav-sub").textContent = "载入失败";
    $("#main").innerHTML = '<div class="wrap">' + errorCard(title, html) + "</div>";
  }

  function bootFail(reason) {
    var isFile = location.protocol === "file:";
    var html = "<p>" + esc(reason) + "</p>";
    if (isFile) {
      html += "<p><b>看起来你是直接双击打开了 index.html。</b>浏览器的安全策略禁止 <code class=\"ic\">file://</code> 页面读取本地文件，所以笔记无法载入。</p>" +
        "<ol><li>回到笔记根目录，双击 <code class=\"ic\">启动学习服务器.bat</code>（macOS / Linux 运行 <code class=\"ic\">./start_server.sh</code>）。</li>" +
        "<li>脚本会自动打开 <code class=\"ic\">http://localhost:8765/web/index.html</code>。</li></ol>";
    } else {
      html += "<ol><li>确认 <code class=\"ic\">web/notes_data.js</code> 与 <code class=\"ic\">web/index.html</code> 在同一个目录。</li>" +
        "<li>确认 <code class=\"ic\">notes_data.js</code> 的第一行是 <code class=\"ic\">window.NOTES_DATA = {</code>，且文件末尾以 <code class=\"ic\">};</code> 结束。</li>" +
        "<li>按 F12 打开控制台查看具体报错。</li>" +
        "<li>若刚在编辑器里改动过笔记，按 Ctrl+Shift+R 强制刷新。</li></ol>";
    }
    fatal("门户数据载入失败", html);
  }

  /**
   * 接收 NOTES_DATA：建立索引、套用 meta.options。
   *
   * 与调试出口共用，所以校验时不需要真的跑一遍启动流程。
   */
  function adoptData(data) {
    state.data = data;
    state.index = buildIndex(data);
    state.opts = { katex: "auto", fillCaseSensitive: false };
    if (data && data.meta && data.meta.options) {
      if (data.meta.options.fillCaseSensitive != null) state.opts.fillCaseSensitive = !!data.meta.options.fillCaseSensitive;
      if (data.meta.options.katex != null) state.opts.katex = data.meta.options.katex;
    }
    return state.index;
  }

  function start() {
    if (location.protocol === "file:") { bootFail("本门户需要通过本地服务器打开。"); return; }

    state.progress = readLS(LS.progress, {});
    state.scores = readLS(LS.scores, {});
    state.quiz = readLS(LS.quiz, {});
    state.last = readLS(LS.last, null);

    var script = document.createElement("script");
    script.src = "notes_data.js";
    script.onload = function () {
      var data = window.NOTES_DATA;
      if (!data || typeof data !== "object" || !Array.isArray(data.chapters)) {
        bootFail("notes_data.js 已加载，但没有定义有效的 window.NOTES_DATA（缺少 chapters 数组）。");
        return;
      }
      adoptData(data);
      var subject = (data.meta && data.meta.subject) || "学习笔记";
      document.title = subject + " · 学习门户";
      $("#nav-brand").textContent = String(subject).toUpperCase().slice(0, 22);
      var ov = overallProgress();
      $("#nav-sub").textContent = (data.chapters.length) + " 章 · " + ov.total + " 节 · 完成 " + ov.pct + "%";
      if (!location.hash) location.hash = "#/home";
      render();
      ensureKatex();
    };
    script.onerror = function () {
      bootFail("无法加载 notes_data.js。文件可能不存在、路径不对，或内容有语法错误。");
    };
    document.head.appendChild(script);
  }

  /* ---------------------------------------------------------------
     调试出口。
     暴露纯函数，便于在浏览器控制台或 Node 无头环境中验证渲染与判分，
     例如：__NOTES_PORTAL__.renderMarkdown("- [ ] 任务", {})
     --------------------------------------------------------------- */
  window.__NOTES_PORTAL__ = {
    version: 1,
    useData: adoptData,
    renderMarkdown: renderMarkdown,
    inline: inline,
    slugify: slugify,
    gradeOne: gradeOne,
    buildIndex: buildIndex,
    stripFrontmatter: stripFrontmatter,
    resolveRelative: resolveRelative
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</body>
</html>

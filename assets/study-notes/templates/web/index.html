<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>学习门户</title>
<style>
/* ============================================================
   学习门户 · 单文件应用
   黑色机械风 × 毛玻璃。零构建、零安装、离线可用。
   ============================================================ */

:root {
  --bg: #0a0d12;
  --panel: #11151c;
  --armor: #1a2029;
  --text: #d6deeb;
  --dim: #8b98ab;
  --accent: #00e5ff;
  --warn: #ff9f1c;
  --ok: #3ddc84;
  --bad: #ff5470;
  --violet: #a78bfa;
  --glass: rgba(255, 255, 255, .05);
  --glass-line: rgba(255, 255, 255, .09);
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --nav-w: 306px;
  --radius: 12px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---------- 背景：网格 + 扫描线 ---------- */
.bg-grid, .bg-scan { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.bg-grid {
  background-image:
    linear-gradient(rgba(0, 229, 255, .045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, .045) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 20%, transparent 78%);
}
.bg-scan {
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
  opacity: .5;
}

/* ---------- 骨架 ---------- */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
  height: 100%;
}

.nav {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 12px 0 12px 12px;
  padding: 14px 12px;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--glass-line);
  border-radius: var(--radius);
  overflow: hidden;
}

.content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 26px 12px;
  min-height: 62px;
}

.main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 26px 60px;
  scroll-behavior: smooth;
}

.wrap { max-width: 74rem; margin: 0 auto; }
.read-wrap { max-width: 62rem; margin: 0 auto; }

/* ---------- HUD 标签 / 标题 ---------- */
.hud {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--dim);
}
.hud .dot { color: var(--accent); }

.h1 {
  font-size: clamp(1.5rem, 3.2vw, 2.1rem);
  font-weight: 700;
  letter-spacing: .01em;
  margin: 2px 0 0;
}
.h1 .accent { color: var(--accent); }

.sub { color: var(--dim); font-size: .92rem; }

/* ---------- 玻璃面板 + 机械角 ---------- */
.panel {
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--glass-line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.panel.mech { clip-path: polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); border-radius: 4px; }
.panel.mech::before, .panel.mech::after {
  content: ""; position: absolute; width: 22px; height: 22px; pointer-events: none;
  border: 2px solid rgba(0, 229, 255, .5);
}
.panel.mech::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.panel.mech::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

.panel-title {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin: 0 0 14px;
  font-size: 1.05rem; font-weight: 650;
}

/* 装甲分割线 */
.rule {
  position: relative; height: 12px; margin: 22px 0;
  border-top: 1px solid var(--glass-line);
  border-bottom: 1px solid rgba(255, 255, 255, .045);
}
.rule::after {
  content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 3px;
  background-image: radial-gradient(circle, rgba(0,229,255,.45) 1.4px, transparent 1.6px);
  background-size: 26px 3px;
  background-repeat: repeat-x;
  opacity: .6;
}

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; cursor: pointer;
  font: inherit; font-size: .88rem;
  padding: 8px 15px;
  border-radius: 8px;
  border: 1px solid var(--glass-line);
  background: rgba(255,255,255,.045);
  color: var(--text);
  transition: background .16s ease, box-shadow .16s ease, border-color .16s ease, transform .16s ease;
}
.btn:hover { background: rgba(255,255,255,.09); border-color: rgba(0,229,255,.4); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  border-color: rgba(0,229,255,.55);
  background: rgba(0,229,255,.13);
  color: #eafcff;
  box-shadow: 0 0 16px rgba(0,229,255,.18);
}
.btn.primary:hover { background: rgba(0,229,255,.22); box-shadow: 0 0 22px rgba(0,229,255,.3); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(255,84,112,.5); color: #ffd7de; background: rgba(255,84,112,.1); }
.btn.danger:hover { background: rgba(255,84,112,.2); }
.btn.ok { border-color: rgba(61,220,132,.5); background: rgba(61,220,132,.12); color: #ddffe9; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.mono { font-family: var(--mono); font-size: .78rem; letter-spacing: .06em; }

/* ---------- 侧栏导航树 ---------- */
.nav-head { padding: 2px 4px 12px; border-bottom: 1px solid var(--glass-line); margin-bottom: 10px; }
.nav-brand { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
.nav-sub { font-size: .74rem; color: var(--dim); margin-top: 2px; }
.nav-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; margin-right: -4px; }
.nav-foot { padding-top: 10px; border-top: 1px solid var(--glass-line); margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

.nav-ch { margin-bottom: 2px; }
.nav-ch-btn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  background: transparent; border: 0; cursor: pointer;
  font: inherit; font-size: .84rem; color: var(--text);
  padding: 7px 8px; border-radius: 7px; text-align: left;
}
.nav-ch-btn:hover { background: rgba(255,255,255,.055); }
.nav-ch-btn .caret { font-family: var(--mono); font-size: 10px; color: var(--dim); transition: transform .18s ease; }
.nav-ch.open .nav-ch-btn .caret { transform: rotate(90deg); }
.nav-ch-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-secs { display: none; padding: 2px 0 4px 8px; margin-left: 8px; border-left: 1px solid var(--glass-line); }
.nav-ch.open .nav-secs { display: block; }
.nav-sec {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 6px;
  font-size: .8rem; color: var(--dim); text-decoration: none;
  border-left: 2px solid transparent;
}
.nav-sec:hover { background: rgba(255,255,255,.05); color: var(--text); }
.nav-sec.active { color: #eafcff; background: rgba(0,229,255,.1); border-left-color: var(--accent); }
.nav-sec .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-test {
  display: block; padding: 4px 8px; border-radius: 6px;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--warn); text-decoration: none;
}
.nav-test:hover { background: rgba(255,159,28,.12); }
.nav-test.active { background: rgba(255,159,28,.16); }

.lamp {
  width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
  background: rgba(255,255,255,.14); box-shadow: none;
}
.lamp.done { background: var(--ok); box-shadow: 0 0 7px rgba(61,220,132,.75); }
.lamp.wip { background: var(--warn); box-shadow: 0 0 7px rgba(255,159,28,.75); }

/* ---------- 仪表盘 ---------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 10px;
  padding: 13px 15px;
}
.stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.stat .v { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; margin-top: 4px; color: var(--accent); }
.stat .v.ok { color: var(--ok); }
.stat .v.warn { color: var(--warn); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }

.ch-card {
  position: relative;
  background: linear-gradient(160deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
  border: 1px solid var(--glass-line);
  border-radius: 4px;
  padding: 17px 18px 15px;
  clip-path: polygon(0 13px, 13px 0, 100% 0, 100% calc(100% - 13px), calc(100% - 13px) 100%, 0 100%);
  transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
}
.ch-card:hover { box-shadow: 0 0 0 1px rgba(0,229,255,.28), 0 8px 30px rgba(0,0,0,.45); transform: translateY(-2px); }
.ch-card .ch-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ch-card .ch-no { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--accent); }
.ch-card .ch-name { font-size: 1.06rem; font-weight: 650; margin: 7px 0 4px; }
.ch-card .ch-brief { color: var(--dim); font-size: .85rem; min-height: 2.6em; }
.ch-card .ch-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.ch-card .ch-score { font-family: var(--mono); font-size: .8rem; color: var(--warn); white-space: nowrap; }

.bar { flex: 1; height: 6px; background: rgba(255,255,255,.09); border-radius: 4px; overflow: hidden; }
.bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, rgba(0,229,255,.65), var(--accent));
  box-shadow: 0 0 10px rgba(0,229,255,.5);
  transition: width .6s cubic-bezier(.22,1,.36,1);
}
.bar-fill.full { background: linear-gradient(90deg, rgba(61,220,132,.6), var(--ok)); box-shadow: 0 0 10px rgba(61,220,132,.5); }

/* ---------- 阅读视图 ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.crumbs a { color: var(--dim); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { opacity: .45; }

.badges { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 0; }
.badge {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .05em;
  padding: 3px 9px; border-radius: 20px;
  border: 1px solid rgba(167,139,250,.4); background: rgba(167,139,250,.12); color: #ddd2ff;
  text-decoration: none;
}
.badge:hover { background: rgba(167,139,250,.24); }
.badge.plain { border-color: var(--glass-line); background: rgba(255,255,255,.05); color: var(--dim); }

.note-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.chip {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .06em;
  padding: 2px 8px; border-radius: 20px; border: 1px solid var(--glass-line);
  background: rgba(255,255,255,.04); color: var(--dim);
}
.chip.accent { border-color: rgba(0,229,255,.4); color: #b9f4ff; background: rgba(0,229,255,.09); }

/* 正文排版 */
.md { max-width: 78ch; }
.md > *:first-child { margin-top: 0; }
.md h1 { font-size: 1.75rem; line-height: 1.3; margin: 1.4em 0 .6em; padding-bottom: .3em; border-bottom: 1px solid var(--glass-line); }
.md h2 { font-size: 1.3rem; margin: 1.7em 0 .55em; padding-left: 11px; border-left: 3px solid var(--accent); }
.md h3 { font-size: 1.1rem; margin: 1.4em 0 .45em; color: #e8f6ff; }
.md h4 { font-size: 1rem; margin: 1.2em 0 .4em; color: var(--dim); }
.md p { margin: .78em 0; }
.md ul, .md ol { margin: .7em 0; padding-left: 1.5em; }
.md li { margin: .3em 0; }
.md li > ul, .md li > ol { margin: .3em 0; }
.md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(0,229,255,.32); }
.md a:hover { border-bottom-color: var(--accent); }
.md strong { color: #fff; font-weight: 650; }
.md em { color: #eaf6ff; }
.md del { color: var(--dim); }
.md hr { border: 0; border-top: 1px solid var(--glass-line); margin: 1.8em 0; }
.md blockquote {
  margin: 1em 0; padding: .1em 1.1em;
  border-left: 3px solid rgba(255,255,255,.16);
  color: #c3cede; background: rgba(255,255,255,.028);
}
.md code.ic {
  font-family: var(--mono); font-size: .87em;
  background: rgba(0,229,255,.1); color: #b9f4ff;
  padding: .13em .4em; border-radius: 5px; border: 1px solid rgba(0,229,255,.18);
}
.md .task { display: flex; gap: 8px; align-items: flex-start; list-style: none; margin-left: -1.15em; }
.md .task input { margin-top: .42em; accent-color: var(--accent); }

.md table { border-collapse: collapse; width: 100%; margin: 1.1em 0; font-size: .9rem; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--glass-line); padding: 7px 11px; text-align: left; vertical-align: top; }
.md th { background: rgba(0,229,255,.07); font-weight: 650; white-space: nowrap; }
.md tbody tr:hover { background: rgba(255,255,255,.03); }

.md img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--glass-line); margin: 1em 0; display: block; }
.md .img-missing {
  display: block; font-family: var(--mono); font-size: .78rem; color: var(--bad);
  border: 1px dashed rgba(255,84,112,.45); background: rgba(255,84,112,.07);
  padding: 10px 12px; border-radius: 8px; margin: 1em 0;
}

/* 代码块 */
.md .cb { margin: 1.1em 0; border: 1px solid var(--glass-line); border-radius: 10px; overflow: hidden; background: #0c1017; }
.md .cb-bar {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  padding: 6px 12px; background: rgba(255,255,255,.035); border-bottom: 1px solid var(--glass-line);
}
.md .cb-lang { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.md .cb-copy { font-family: var(--mono); font-size: .68rem; color: var(--dim); background: transparent; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 5px; }
.md .cb-copy:hover { color: var(--accent); background: rgba(0,229,255,.1); }
.md .cb pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.md .cb code { font-family: var(--mono); font-size: .84rem; line-height: 1.65; color: #cfe6f5; white-space: pre; }
.md .cb-mermaid { padding: 14px 16px; }
.md .cb-mermaid pre { padding: 0; }
.md .cb-mermaid .mermaid-hint { font-family: var(--mono); font-size: .7rem; color: var(--dim); margin-top: 8px; letter-spacing: .06em; }

/* 公式降级 */
.tex {
  font-family: var(--mono); font-size: .88em;
  background: rgba(255,159,28,.1); color: #ffd9a8;
  padding: .1em .4em; border-radius: 5px; border: 1px solid rgba(255,159,28,.2);
}
.tex-block {
  display: block; text-align: center; margin: 1.1em 0; padding: .8em 1em;
  overflow-x: auto; white-space: pre-wrap; word-break: break-word;
}
.katex { font-size: 1.02em; }
.katex-display { margin: .95em 0; overflow-x: auto; overflow-y: hidden; padding: .15em 0; }

/* Callout */
.callout {
  margin: 1.05em 0; border-radius: 10px; overflow: hidden;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--glass-line);
  border-left: 3px solid var(--co, var(--accent));
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
}
.callout-head {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 14px; cursor: default;
  background: linear-gradient(90deg, color-mix(in srgb, var(--co, var(--accent)) 16%, transparent), transparent 70%);
}
.callout-fold > .callout-head { cursor: pointer; user-select: none; }
.callout-fold > .callout-head:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--co) 24%, transparent), transparent 70%); }
.callout-ico { font-family: var(--mono); font-size: .9rem; color: var(--co, var(--accent)); line-height: 1; }
.callout-title { font-weight: 650; font-size: .93rem; color: var(--co, var(--accent)); flex: 1; }
.callout-arrow { font-family: var(--mono); font-size: .72rem; color: var(--co, var(--accent)); transition: transform .2s ease; }
.callout-fold.open .callout-arrow { transform: rotate(90deg); }
.callout-body { padding: 2px 15px 12px; }
.callout-fold:not(.open) > .callout-body { display: none; }
.callout-body > *:first-child { margin-top: .55em; }
.callout-body .callout { margin: .7em 0; }

.callout--abstract { --co: var(--accent); }
.callout--note, .callout--info { --co: #63b3ff; }
.callout--tip, .callout--hint { --co: var(--ok); }
.callout--example { --co: var(--violet); }
.callout--question, .callout--help { --co: var(--warn); }
.callout--warning, .callout--caution, .callout--danger { --co: var(--bad); }
.callout--success, .callout--check, .callout--done { --co: var(--ok); }
.callout--quote, .callout--cite { --co: var(--dim); }
.callout--bug, .callout--failure, .callout--fail { --co: var(--bad); }
.callout--todo { --co: #63b3ff; }
.callout--important { --co: var(--warn); }

/* 未解析的 wikilink */
.wl { color: var(--accent); border-bottom: 1px dashed rgba(0, 229, 255, .4); }
.wl-missing {
  color: var(--warn); border-bottom: 1px dashed rgba(255,159,28,.55);
  cursor: help; font-style: normal;
}

/* ---------- 练习 / 测试 ---------- */
.qitem { padding: 15px 0; border-top: 1px solid var(--glass-line); }
.qitem:first-of-type { border-top: 0; }
.q-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.q-no { font-family: var(--mono); font-size: .8rem; color: var(--accent); flex: 0 0 auto; }
.q-score { font-family: var(--mono); font-size: .72rem; color: var(--dim); margin-left: auto; flex: 0 0 auto; }
.q-body { margin-bottom: 10px; }
.q-opts { display: flex; flex-direction: column; gap: 7px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; cursor: pointer;
  padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--glass-line); background: rgba(255,255,255,.028);
  transition: background .15s ease, border-color .15s ease;
}
.opt:hover { background: rgba(255,255,255,.06); border-color: rgba(0,229,255,.3); }
.opt input { margin-top: .35em; accent-color: var(--accent); flex: 0 0 auto; }
.opt-key { font-family: var(--mono); font-size: .78rem; color: var(--dim); flex: 0 0 auto; }
.opt.right { border-color: rgba(61,220,132,.55); background: rgba(61,220,132,.11); }
.opt.wrong { border-color: rgba(255,84,112,.55); background: rgba(255,84,112,.1); }
.opt.locked { cursor: default; }

.inp, .ta {
  width: 100%; font: inherit; font-size: .9rem;
  color: var(--text); background: rgba(0,0,0,.28);
  border: 1px solid var(--glass-line); border-radius: 8px; padding: 9px 11px;
  outline: none; transition: border-color .15s ease, box-shadow .15s ease;
}
.inp:focus, .ta:focus { border-color: rgba(0,229,255,.55); box-shadow: 0 0 0 3px rgba(0,229,255,.1); }
.inp.right { border-color: rgba(61,220,132,.6); }
.inp.wrong { border-color: rgba(255,84,112,.6); }
.ta { min-height: 92px; resize: vertical; font-family: var(--mono); font-size: .84rem; line-height: 1.6; }
.judge-row { display: flex; gap: 10px; flex-wrap: wrap; }

.verdict {
  margin-top: 11px; padding: 11px 13px; border-radius: 9px;
  border: 1px solid var(--glass-line); background: rgba(255,255,255,.035);
  animation: flash .28s ease;
}
.verdict.right { border-color: rgba(61,220,132,.5); background: rgba(61,220,132,.09); }
.verdict.wrong { border-color: rgba(255,84,112,.5); background: rgba(255,84,112,.09); }
.verdict .vt { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
.verdict.right .vt { color: var(--ok); }
.verdict.wrong .vt { color: var(--bad); }
.verdict .va { margin-top: 5px; font-size: .89rem; }
.verdict .vx { margin-top: 7px; font-size: .87rem; color: #c3cede; }

@keyframes flash {
  0% { opacity: 0; transform: translateY(-4px); }
  100% { opacity: 1; transform: none; }
}

.q-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
.q-note { font-size: .82rem; color: var(--dim); }

/* 成绩单 */
.score-head { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ring { width: 132px; height: 132px; flex: 0 0 auto; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .ring-bg { stroke: rgba(255,255,255,.09); }
.ring .ring-fg { stroke: var(--accent); transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); filter: drop-shadow(0 0 6px rgba(0,229,255,.55)); }
.ring.good .ring-fg { stroke: var(--ok); filter: drop-shadow(0 0 6px rgba(61,220,132,.55)); }
.ring.bad .ring-fg { stroke: var(--bad); filter: drop-shadow(0 0 6px rgba(255,84,112,.55)); }
.ring-wrap { position: relative; width: 132px; height: 132px; }
.ring-val {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
}
.ring-val .n { font-family: var(--mono); font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
.ring.good ~ .ring-val .n { color: var(--ok); }
.ring-val .d { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.score-list { flex: 1; min-width: 220px; }
.score-list .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--glass-line); font-size: .88rem; }
.score-list .row .k { color: var(--dim); }
.score-list .row .v { font-family: var(--mono); }
.score-list .row .v.ok { color: var(--ok); }
.score-list .row .v.bad { color: var(--bad); }

.selfscore { display: flex; align-items: center; gap: 9px; margin-top: 10px; flex-wrap: wrap; }
.selfscore .inp { width: 90px; }
.selfscore .max { font-family: var(--mono); font-size: .8rem; color: var(--dim); }

/* ---------- 图谱 ---------- */
.graph { width: 100%; height: auto; display: block; }
.graph .gnode circle { fill: rgba(0,229,255,.1); stroke: rgba(0,229,255,.5); stroke-width: 1.4; }
.graph .gnode text { fill: var(--dim); font-family: var(--mono); font-size: 9px; }
.graph .gnode:hover circle { fill: rgba(0,229,255,.26); }
.graph .gedge { stroke: rgba(255,255,255,.14); stroke-width: 1; }

/* ---------- 搜索 ---------- */
.search-box { display: flex; gap: 10px; margin-bottom: 16px; }
.sres { padding: 12px 0; border-top: 1px solid var(--glass-line); }
.sres:first-of-type { border-top: 0; }
.sres .st { font-weight: 620; }
.sres .st a { color: var(--accent); text-decoration: none; }
.sres .sp { font-family: var(--mono); font-size: .7rem; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.sres .ss { color: var(--dim); font-size: .85rem; margin-top: 4px; }
.sres mark { background: rgba(255,159,28,.26); color: #ffe6bd; border-radius: 3px; padding: 0 2px; }

/* ---------- 通用块 ---------- */
.empty { text-align: center; color: var(--dim); padding: 46px 20px; }
.empty .big { font-family: var(--mono); font-size: 1.1rem; color: var(--accent); letter-spacing: .1em; }
.loading { display: flex; align-items: center; gap: 10px; color: var(--dim); font-family: var(--mono); font-size: .82rem; padding: 34px 0; letter-spacing: .1em; }
.loading::after {
  content: ""; width: 26px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: sweep 1s linear infinite;
}
@keyframes sweep { 0% { opacity: .25; } 50% { opacity: 1; } 100% { opacity: .25; } }

.err-card { border-color: rgba(255,84,112,.42); }
.err-card .panel-title { color: var(--bad); }
.err-card code { font-family: var(--mono); font-size: .82rem; color: #ffd7de; background: rgba(255,84,112,.1); padding: 2px 6px; border-radius: 5px; }
.err-card ol { padding-left: 1.4em; }

.navrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.spacer { flex: 1; }

/* ---------- 弹层 / 提示 ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(4,6,9,.62); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.scrim.on { display: flex; }
.modal {
  width: min(430px, 100%);
  background: rgba(17,21,28,.9);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--glass-line); border-radius: var(--radius);
  padding: 20px 22px; box-shadow: 0 24px 70px rgba(0,0,0,.6);
}
.modal h3 { margin: 0 0 8px; font-size: 1.05rem; }
.modal p { margin: 0 0 16px; color: var(--dim); font-size: .9rem; }
.modal .acts { display: flex; gap: 10px; justify-content: flex-end; }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: rgba(17,21,28,.94); border: 1px solid var(--glass-line); border-left: 3px solid var(--accent);
  border-radius: 9px; padding: 10px 14px; font-size: .87rem;
  box-shadow: 0 12px 34px rgba(0,0,0,.5);
  animation: toast-in .22s ease;
  max-width: 340px;
}
.toast.ok { border-left-color: var(--ok); }
.toast.bad { border-left-color: var(--bad); }
.toast.warn { border-left-color: var(--warn); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 顶栏按钮 ---------- */
.menu-btn { display: none; }

/* ---------- 响应式 ---------- */
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav {
    position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(88vw, var(--nav-w));
    margin: 0; border-radius: 0 var(--radius) var(--radius) 0;
    transform: translateX(-103%); transition: transform .22s ease;
  }
  .nav.open { transform: none; }
  .nav-scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); display: none; }
  .nav-scrim.on { display: block; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 12px 16px 8px; }
  .main { padding: 4px 16px 52px; }
}
@media (max-width: 420px) {
  body { font-size: 15px; }
  .stat .v { font-size: 1.25rem; }
  .panel { padding: 16px 15px; }
}

/* ---------- 动效偏好 ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .main { scroll-behavior: auto; }
}
</style>

  <aside class="nav" id="nav">
    <div class="nav-head">
